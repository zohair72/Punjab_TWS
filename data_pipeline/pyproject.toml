[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "punjab-groundwater-stress-data-pipeline"
version = "0.1.0"
description = "Data pipeline scaffolding for Punjab-scale TWS anomaly processing."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "earthengine-api>=0.1.409",
    "pandas>=2.2.2",
    "python-dotenv>=1.0.1",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["data_pipeline*"]
